# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: AI前沿分享 # the website title (if blank, full name will be used instead)
first_name: Agi
middle_name:
last_name: Frontier
author:
  name: AGI Frontier
  uri: https://agifrontier.github.io/
contact_note: >
  持续整理 AI 论文、工程实践与前沿趋势。
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  面向 AI 工程师与研究者的前沿论文解读，持续整理大模型、AI Agent、RAG、推理优化、多模态与具身智能的核心方法、实验结论和实践启示。
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
  Photos from <a href="https://unsplash.com" target="_blank">Unsplash</a>.
keywords: AI论文解读, AI Agent, 大模型, RAG, 推理优化, 多模态, 具身智能
lang: zh-CN # the language of your site (for example: en, fr, cn, ru, etc.)
icon: ⚛️ # the emoji used as the favicon (alternatively, provide image name in /assets/img/)

url: https://agifrontier.github.io # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog/. Leave blank for root
last_updated: false # set to true if you want to display last updated in the footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR
back_to_top: true # set to false to disable the back to top button

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# repo color theme
repo_theme_light: default # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_theme_dark: dark # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_trophies:
  enabled: true
  theme_light: flat # https://github.com/ryo-ma/github-profile-trophy
  theme_dark: gitdimmed # https://github.com/ryo-ma/github-profile-trophy

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization
feed:
  path: /feed/posts.xml
  posts_limit: 20
  collections:
    tutorials:
      path: /feed.xml

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

# Dimensions
max_width: 700px

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
# see https://schema.org/docs/faq.html for more information
serve_og_meta: true # Include Open Graph meta tags in the HTML head
serve_schema_org: true # Include Schema.org in the HTML head
og_image: /assets/img/og-default.png # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics: # your Google Analytics measurement ID (format: G-XXXXXXXXXX)
cronitor_analytics: # cronitor RUM analytics site ID (format: XXXXXXXXX)
pirsch_analytics: # your Pirsch analytics site ID (length 32 characters)
openpanel_analytics: # your Openpanel analytics client ID (format: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)

google_site_verification: # your google-site-verification ID (Google Search Console)
bing_site_verification: # out your bing-site-verification ID (Bing Webmaster)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: AI前沿分享 # blog_name will be displayed in your blog page
blog_description: AI 论文解读、工程实践与前沿趋势。
permalink: /blog/:year/:title/
lsi: false # produce an index for related posts

# Pagination
pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus comments (RECOMMENDED)
# Follow instructions on https://giscus.app/ to setup for your repo to fill out the information below.
giscus:
  repo: # <your-github-user-name>/<your-github-repo-name>
  repo_id: # leave empty or specify your repo_id (see https://giscus.app/)
  category: Comments # name of the category under which discussions will be created
  category_id: # leave empty or specify your category_id (see https://giscus.app/)
  mapping: title # identify discussions by post title
  strict: 1 # use strict identification mode
  reactions_enabled: 1 # enable (1) or disable (0) emoji reactions
  input_position: bottom # whether to display input form below (bottom) or above (top) the comments
  dark_theme: dark # name of the dark color scheme (preferred works well with al-folio dark mode)
  light_theme: light # name of the light color scheme (preferred works well with al-folio light mode)
  emit_metadata: 0
  lang: en

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages", "_scripts"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Plug-ins
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - jekyll-seo-tag

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  exclude: ["robots.txt", "assets/js/search/*.js"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

tutorial_topics:
  - name: AI Agent
    slug: ai-agent
    seo_title: AI Agent论文解读：智能体架构、工具调用与评测
    description: 聚合AI Agent论文解读，覆盖智能体架构、工具调用、规划记忆、多智能体协作、Agent Harness与基准评测等前沿研究。
  - name: RAG
    slug: rag
    legacy_slug: rag-knowledge
    seo_title: RAG论文解读：检索增强生成、知识库与最新研究
    description: 聚合RAG论文解读，覆盖检索增强生成、向量检索、知识库构建、长文本问答、GraphRAG及企业知识应用等研究进展。
  - name: 知识系统
    slug: knowledge-systems
    seo_title: 知识系统论文解读：知识图谱、记忆与信息检索
    description: 聚合AI知识系统论文解读，覆盖知识图谱、长期记忆、信息检索、知识组织、知识更新与可信问答等核心方法。
  - name: 推理
    slug: reasoning
    legacy_slug: reasoning-rl
    seo_title: 大模型推理论文解读：思维链、搜索与测试时计算
    description: 聚合大模型推理论文解读，覆盖思维链、搜索规划、数学推理、测试时计算、过程监督与复杂问题求解等研究方向。
  - name: 强化学习
    slug: reinforcement-learning
    seo_title: 强化学习论文解读：RLHF、策略优化与智能体训练
    description: 聚合强化学习论文解读，覆盖RLHF、策略优化、奖励建模、离线强化学习、智能体训练与大模型后训练等最新研究。
  - name: 模型训练
    slug: model-training
    seo_title: 大模型训练论文解读：预训练、微调与数据配方
    description: 聚合大模型训练论文解读，覆盖预训练、指令微调、数据配方、分布式训练、持续学习与高效训练系统等关键技术。
  - name: 模型优化
    slug: model-optimization
    seo_title: 模型优化论文解读：压缩、量化与推理加速
    description: 聚合模型优化论文解读，覆盖模型压缩、量化、剪枝、蒸馏、稀疏化、推理加速、低成本部署与硬件协同优化等工程方法。
  - name: "多模态&视觉"
    slug: multimodal
    legacy_slugs:
      - multimodal-vision
      - computer-vision
    seo_title: 多模态&视觉论文解读：视觉语言模型与生成技术
    description: 聚合多模态与计算机视觉论文解读，覆盖视觉语言模型、图像理解、视频生成、视觉表征、跨模态对齐与统一建模。
  - name: 具身智能
    slug: embodied-ai
    legacy_slug: embodied-robotics
    seo_title: 具身智能论文解读：机器人、VLA与世界模型
    description: 聚合具身智能论文解读，覆盖机器人学习、视觉语言动作模型、世界模型、操作导航、仿真训练与真实环境部署。
  - name: AI安全
    slug: ai-safety
    legacy_slug: ai-safety-evaluation
    seo_title: AI安全论文解读：对齐、可控性与风险治理
    description: 聚合AI安全论文解读，覆盖模型对齐、越狱防御、可控生成、红队测试、隐私安全、风险识别、治理机制与可信部署实践。
  - name: AI评测
    slug: ai-evaluation
    seo_title: AI评测论文解读：基准测试、LLM裁判与能力测量
    description: 聚合AI评测论文解读，覆盖基准测试、LLM-as-a-Judge、能力测量、可靠性评估、Agent评测与数据污染检测。
  - name: 数据工程
    slug: data-engineering
    legacy_slug: data-ai-engineering
    seo_title: AI数据工程论文解读：数据治理、合成与质量优化
    description: 聚合AI数据工程论文解读，覆盖数据清洗、数据合成、质量评估、数据选择、数据治理、大模型数据流水线与生产实践。
  - name: AI工程
    slug: ai-engineering
    seo_title: AI工程论文解读：大模型系统、部署与基础设施
    description: 聚合AI工程论文解读，覆盖大模型服务、推理系统、Agent基础设施、可观测性、成本优化与生产环境部署实践。
  - name: 行业应用
    slug: industry-applications
    seo_title: AI行业应用论文解读：医疗、金融、教育与科研
    description: 聚合AI行业应用论文解读，覆盖医疗、金融、教育、科研、工业与软件工程等领域的模型方法、评测和落地经验。
  - name: 基础模型
    slug: foundation-models
    seo_title: 基础模型论文解读：LLM架构、能力与扩展规律
    description: 聚合基础模型论文解读，覆盖大语言模型架构、扩展规律、涌现能力、预训练机制、模型分析与下一代基础模型。
  - name: AI理论
    slug: ai-theory
    seo_title: AI理论论文解读：学习理论、机制分析与能力边界
    description: 聚合AI理论论文解读，覆盖学习理论、泛化机制、表示能力、可解释性、复杂性分析、人工智能能力边界与前沿理论问题。

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Display different badges withs stats for your publications
# Customize badge behavior in _layouts/bib.liquid
enable_publication_badges:
  altmetric: true # Altmetric badge (Customization options: https://badge-docs.altmetric.com/index.html)
  dimensions: true # Dimensions badge (Customization options: https://badge.dimensions.ai/)
  google_scholar: true # Google Scholar badge (https://scholar.google.com/intl/en/scholar/citations.html)
  inspirehep: true # Inspire HEP badge (https://help.inspirehep.net/knowledge-base/citation-metrics/)

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    google_scholar_id,
    html,
    inspirehep_id,
    pdf,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

# These are the defaults
external_links:
  enabled: true
  rel: external noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
imagemagick:
  enabled: false # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false # enables google analytics
enable_cronitor_analytics: false # enables cronitor RUM analytics
enable_pirsch_analytics: false # enables Pirsch analytics (https://pirsch.io/)
enable_openpanel_analytics: false # enables Openpanel analytics (https://openpanel.dev/)
enable_google_verification: false # enables google site verification
enable_bing_verification: false # enables bing site verification
enable_masonry: true # enables automatic project cards arrangement
enable_math: true # enables math typesetting (uses MathJax)
enable_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable_darkmode: true # enables switching between light/dark modes
enable_navbar_social: false # enables displaying social links in the navbar on the about page
enable_project_categories: true # enables categorization of projects into multiple categories
enable_medium_zoom: true # enables image zoom feature (as on medium.com)
enable_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable_video_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

